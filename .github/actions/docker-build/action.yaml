name: "Docker build"
description: "Docker build"
inputs:
  registry-name:
    description: "ACR container registry name"
    required: true
  repository:
    description: "ACR container repository"
    required: true
    default: herond-accounts
  docker-user:
    description: "Docker login user"
    required: true
  docker-password:
    description: "Docker login password"
    required: true
  image-tag:
    description: Target image tag
    required: true
    default: latest
  environment:
    description: Build environment
    required: true
    default: prod
runs:
  using: "composite"
  steps:
  - name: Set up QEMU
    uses: docker/setup-qemu-action@v2

  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v2

  - name: Login to Azure Containter Registry
    uses: docker/login-action@v2
    with:
      registry: ${{ inputs.registry-name }}
      username: ${{ inputs.docker-user }}
      password: ${{ inputs.docker-password }}

  - name: Build and push Docker images
    uses: docker/build-push-action@v4.0.0
    with:
      context: .
      file: ./Dockerfile
      push: true
      build-args: environment=${{ inputs.environment }}
      tags: ${{ inputs.registry-name }}/${{ inputs.repository }}:${{ inputs.image-tag }}
