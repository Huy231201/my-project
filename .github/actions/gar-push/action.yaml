name: "Docker build"
description: "Docker build & push to Google Artifact Registry"

inputs:
  region:
    description: "GAR region (vd: asia-southeast1)"
    required: true
  project-id:
    description: "GCP Project ID"
    required: true
  repository:
    description: "GAR repository name (docker repo)"
    required: true
    default: apps
  image-name:
    description: "Image name"
    required: true
    default: herond-accounts
  credentials-json:
    description: "Service Account Key JSON (minify 1 dòng)"
    required: true
  image-tag:
    description: "Target image tag"
    required: true
    default: latest
  environment:
    description: "Build environment"
    required: true
    default: prod
  docker-file-path:
    description: "Path to Dockerfile"
    required: true
    default: ./Dockerfile
  lark_webhook:
    description: "Lark webhook"
    required: false
  github_token:
    description: "GitHub token"
    required: true
  build-args:
    description: "Build arguments"
    required: false
  build-context:
    description: Path to Docker build context
    required: false
    default: .    

runs:
  using: "composite"
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
 
    - name: Login to GAR
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.region }}-docker.pkg.dev
        username: _json_key
        password: ${{ inputs.credentials-json }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      id: docker_build
      with:
        context: ${{ inputs.build-context }}
        file: ${{ inputs.docker-file-path }}
        push: true
        build-args: |
          environment=${{ inputs.environment }}
          ${{ inputs.build-args }}
        tags: |
          ${{ inputs.region }}-docker.pkg.dev/${{ inputs['project-id'] }}/${{ inputs.repository }}/${{ inputs['image-name'] }}:${{ inputs['image-tag'] }}
          ${{ inputs.region }}-docker.pkg.dev/${{ inputs['project-id'] }}/${{ inputs.repository }}/${{ inputs['image-name'] }}:latest

    - name: Determine msg color
      if: always()
      shell: bash
      run: |
        if [[ "${{ steps.docker_build.outcome }}" == "success" ]]; then
          echo "MSG_COLOR=green" >> $GITHUB_ENV
        else
          echo "MSG_COLOR=red" >> $GITHUB_ENV
        fi

    - name: Notify Lark
      if: always()
      uses: herondlabs/action-lark-notify@main
      with:
        columnsPerRow: 2
        token: ${{ inputs.github_token }}
        cardItems: |
          **Repo**<br>[${{ github.repository }}]({{GITHUB_REPOSITORY_URL}})
          **Actor**<br>${{ github.actor }}
          **Branch**<br>[${{ github.ref_name }}]({{GITHUB_REPOSITORY_URL}}/tree/${{ github.ref_name }})
          **Image Tag**<br>{{NEW_TAG}}
          **Build Logs**<br>[{{GITHUB_RUN_ID}}]({{GITHUB_JOB_URL}})
      env:
        LARK_WEBHOOK: ${{ inputs.lark_webhook }}
        NEW_TAG: ${{ env.IMAGE_TAG }}
        LARK_MESSAGE_TEMPLATE: "${{ env.MSG_COLOR }}"
        LARK_MESSAGE_TITLE: "GAR Build: ${{ inputs.image-name }}"
