name: "Auto ACR build push"
run-name: "Build tag [${{ github.ref_name }}]"

on:
  workflow_dispatch:
  push:
    tags:
      - "prod-*"
      - "staging-*"
      - "dev-*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Build and push [Production]
      if: ${{false}}
      #if: startsWith(github.ref, 'refs/tags/prod-')
      uses: ./.github/actions/docker-build
      with:
        registry-name: ${{ secrets.HEROND_PRODUCTION_ACR_USERNAME }}.azurecr.io
        docker-user: ${{ secrets.HEROND_PRODUCTION_ACR_USERNAME }}
        docker-password: ${{ secrets.HEROND_PRODUCTION_ACR_PASSWORD }}
        repository: ${{ vars.REPOSITORY_NAME }}
        environment: prod
        image-tag: "${{  github.ref_name }}"

    - name: Build and push [Staging]
      if: ${{false}}
      #if: startsWith(github.ref, 'refs/tags/staging-')
      uses: ./.github/actions/docker-build
      with:
        registry-name: ${{ secrets.HEROND_PRODUCTION_ACR_USERNAME }}.azurecr.io
        docker-user: ${{ secrets.HEROND_PRODUCTION_ACR_USERNAME }}
        docker-password: ${{ secrets.HEROND_PRODUCTION_ACR_PASSWORD }}
        repository: ${{ vars.REPOSITORY_NAME }}
        environment: staging
        image-tag: "${{  github.ref_name }}"

    - name: Build and push [Dev]
      if: ${{false}}    
      #if: startsWith(github.ref, 'refs/tags/dev-')
      uses: ./.github/actions/docker-build
      with:
        registry-name: ${{ secrets.HEROND_PRODUCTION_ACR_USERNAME }}.azurecr.io
        docker-user: ${{ secrets.HEROND_PRODUCTION_ACR_USERNAME }}
        docker-password: ${{ secrets.HEROND_PRODUCTION_ACR_PASSWORD }}
        repository: ${{ vars.REPOSITORY_NAME }}
        environment: dev
        image-tag: "${{  github.ref_name }}"