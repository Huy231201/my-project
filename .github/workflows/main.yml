name: Manual Build
run-name: Build manually triggered by ${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      target_env:
        type: choice
        description: Target environment
        options:
        - prod
        - dev
        default: dev
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version: 16
    - name: Install node modules
      run: yarn
    - name: Build
      run: yarn build:${{inputs.target_env}}
    - name: copy folder to remote     
      uses: garygrossgarten/github-action-scp@release
      with:
        local: ${{ github.workspace }}/dist
        remote: /home/azureuser/herond/portal-fe-${{inputs.target_env}}
        host: ${{ secrets.AZ_VM_HOST }}
        username: ${{ secrets.AZ_VM_USERNAME }}
        privateKey: ${{ secrets.AZ_VM_SSH_KEY }}
