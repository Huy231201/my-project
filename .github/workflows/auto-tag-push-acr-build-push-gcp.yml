name: "Push UI to Google registry"
run-name: "Build tag [${{ github.ref_name }}]"

on:
  workflow_dispatch:
  push:
    tags:
      - 'prod-*'
      - 'staging-*'
      - 'dev-*'
      - 'uat-*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Determine Environment
      id: determine_env
      run: |
        tag=$(git describe --tags --abbrev=0)
        env=$(echo "$tag" | cut -d'-' -f1)
        echo "BUILD_ENV=$env" >> $GITHUB_ENV
        echo "Determined BUILD_ENV=$env"

    - name: Set GCP project & region
      id: set_project
      env:
        BUILD_ENV: ${{ env.BUILD_ENV }}
 
        KEY_PROD:    ${{ secrets.GAR_JSON_KEY_PROD }}
        KEY_STAG:    ${{ secrets.GAR_JSON_KEY_STAG }}
        KEY_UAT:     ${{ secrets.GAR_JSON_KEY_UAT }}
        KEY_DEV:     ${{ secrets.GAR_JSON_KEY_DEV }}
        KEY_DEFAULT: ${{ secrets.GAR_JSON_KEY }}

      run: |
        echo "Selecting GCP project from repo vars for BUILD_ENV='$BUILD_ENV'..."

        # Choose correct secrets & vars based on ENV
        case "$BUILD_ENV" in
          prod )
            GCP_PROJECT_ID="${{ vars.GCP_PROJECT_ID_PROD }}"
            GAR_REGION="${{ vars.GAR_REGION_PROD }}"
            GAR_JSON_KEY="$KEY_PROD"
            ;;
          staging )
            GCP_PROJECT_ID="${{ vars.GCP_PROJECT_ID_STAGING }}"
            GAR_REGION="${{ vars.GAR_REGION_STAGING }}"
            GAR_JSON_KEY="$KEY_STAG"
            ;;
          uat )
            GCP_PROJECT_ID="${{ vars.GCP_PROJECT_ID_UAT }}"
            GAR_REGION="${{ vars.GAR_REGION_UAT }}"
            GAR_JSON_KEY="$KEY_UAT"
            ;;
          dev )
            GCP_PROJECT_ID="${{ vars.GCP_PROJECT_ID_DEV }}"
            GAR_REGION="${{ vars.GAR_REGION_DEV }}"
            GAR_JSON_KEY="$KEY_DEV"
            ;;
          * )
            GCP_PROJECT_ID="${{ vars.GCP_PROJECT_ID }}"
            GAR_REGION="${{ vars.GAR_REGION }}"
            GAR_JSON_KEY="$KEY_DEFAULT"
            ;;
        esac
 
        echo "GCP_PROJECT_ID=$GCP_PROJECT_ID" >> $GITHUB_ENV
        echo "GAR_REGION=$GAR_REGION" >> $GITHUB_ENV
 
        echo "GCP_PROJECT_ID=$GCP_PROJECT_ID" >> $GITHUB_OUTPUT
        echo "GAR_REGION=$GAR_REGION" >> $GITHUB_OUTPUT
 
        echo "GAR_JSON_KEY<<EOF" >> $GITHUB_OUTPUT
        printf "%s" "$GAR_JSON_KEY" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

        echo "Selected project: $GCP_PROJECT_ID, region: $GAR_REGION"

    - name: Build and push [${{ env.BUILD_ENV }}]
      if: startsWith(github.ref, 'refs/tags/prod-') || startsWith(github.ref, 'refs/tags/uat-') || startsWith(github.ref, 'refs/tags/dev-') || startsWith(github.ref, 'refs/tags/staging-')
      uses: ./.github/actions/gar-push
      with:
        region: ${{ steps.set_project.outputs.GAR_REGION }}
        project-id: ${{ steps.set_project.outputs.GCP_PROJECT_ID }}
        repository: ${{ vars.GCP_REPOSITORY_NAME }}
        image-name: herond-portal-ui
        credentials-json: ${{ steps.set_project.outputs.GAR_JSON_KEY }}
        image-tag: ${{ github.ref_name }}
        environment: ${{ env.BUILD_ENV }}
        docker-file-path: ./Dockerfile
        lark_webhook: ${{ secrets.LARK_WEBHOOK }}
        github_token: ${{ secrets.GITHUB_TOKEN }}
        build-args: |
          BUILD_VERSION=${{ github.ref_name }}
          NODE_ENV=production
