name: "[Staging] Docker build"

on:
  workflow_dispatch:
  push:
    tags:
      - "staging-*"

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Staging
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Build and push
      uses: ./.github/actions/docker-build
      with:
        registry-name: herondregistrystaging.azurecr.io
        repository: ${{ vars.ACR_IMG_NAME }}
        docker-user: ${{ secrets.ACR_USERNAME }}
        docker-password: ${{ secrets.ACR_PASSWORD }}
        environment: staging
        image-tag: "${{  github.ref_name }}"
