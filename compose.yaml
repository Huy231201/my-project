services:
  postgres:
    image: postgres:18
    container_name: task-manager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: task_manager
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: task_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
